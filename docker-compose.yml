
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      LOG_LEVEL: "info"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2)'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
